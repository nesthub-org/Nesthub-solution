name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Fired by the backend when a blog post is published/updated/deleted, so the
  # new post gets prerendered HTML + a sitemap entry (backend/utils/triggerSiteRebuild.js)
  repository_dispatch:
    types: [blog-updated]

# A newer build supersedes one still running
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          # Repo → Settings → Secrets and variables → Actions → Variables
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./dist/
          # The FTP_USERNAME account's home directory on Hostinger is already
          # public_html/ — pointing server-dir there too was uploading every
          # deploy into a nested public_html/public_html/ that the live site
          # never serves, while the real document root stayed stale. Root ("./")
          # is the actual document root for this account.
          server-dir: ./